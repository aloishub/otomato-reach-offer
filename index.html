<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otomato Reach &middot; Sponsored placement</title>
<meta property="og:title" content="Otomato Reach — sponsored placement">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #050505;
    color: #f4f3f1;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 18px;
    background-image: radial-gradient(900px 420px at 50% -10%, rgba(229,83,26,0.16), transparent 62%);
  }
  .wrap { width: 100%; max-width: 460px; text-align: center; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #E5531A; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-top: 12px; color: #fff; }
  .sub { font-size: 14px; color: #9b9a96; margin-top: 12px; line-height: 1.55; }
  .shot {
    width: 100%;
    max-width: 340px;
    height: auto;
    margin: 28px auto 0;
    display: block;
    border-radius: 26px;
    border: 1px solid #1d1d1d;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: #E5531A; color: #fff; border: none; border-radius: 10px;
    padding: 13px 26px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: background 0.15s; text-decoration: none;
    margin-top: 30px;
  }
  .btn:hover { background: #F06A2E; }
  .note { font-size: 11.5px; color: #6f6e6a; margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Otomato Reach</div>
    <h1>Your sponsored placement, live in the feed</h1>
    <p class="sub">Here is exactly how BOT Chain appears to active DeFi users, right inside the Otomato app.</p>
    <img class="shot" src="placement.png" alt="BOT Chain sponsored placement in the Otomato portfolio feed">
    <a class="btn" target="_blank" rel="noopener" href="mailto:dylan@otomato.xyz?subject=Otomato%20Reach%20campaign">Book a campaign</a>
    <div class="note">Otomato Reach &middot; portfolio-aware, low-noise advertising for active DeFi users.</div>
  </div>
